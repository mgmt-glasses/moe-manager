name: Deploy to Cloud Run

# 手動トリガー（検証用）と develop push（検証環境への自動デプロイ）の両方に対応する。
# develop はデフォルトブランチかつ検証/ステージング用。
# 初期はインフラ未整備のため workflow_dispatch で動作確認し、
# 安定後に develop push 自動デプロイへ移行する想定。
on:
  workflow_dispatch:
  push:
    branches: [develop]

# Workload Identity Federation の OIDC トークン取得に必要
permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: moe-manager-api
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/moe-manager/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/moe-manager/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars="VERTEX_PROJECT=${{ env.PROJECT_ID }},VERTEX_LOCATION=${{ vars.VERTEX_LOCATION }},VERTEX_MODEL=${{ vars.VERTEX_MODEL }}" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,TTS_SERVICE_URL=TTS_SERVICE_URL:latest"
