[project]
name = "voice-library"
version = "0.1.0"
description = "Core Voice Generation and Humanized Dialogue Library"
authors = [
    {name = "hasseeee"}
]
dependencies = [
    "torch>=2.0.0,<2.10.0",
    "torchaudio>=2.0.0,<2.10.0",
    "transformers>=4.30.0",
    "pydantic>=2.0.0",
    "numpy<2.0.0",
    "scipy",
    "soundfile",
    "huggingface-hub>=0.34.0",
    "dacvae",
    "sentencepiece>=0.1.99",
    "google-genai",
    "openai",
    "sqlalchemy",
    "httpx",
]

[tool.uv.sources]
dacvae = { git = "https://github.com/facebookresearch/dacvae" }

[tool.setuptools]
packages = ["mkh_voice"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
