[project]
name = "moe-screentime"
version = "0.1.0"
description = "Screen time and entertainment duration tracking module"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy",
    "fastapi",
    "google-genai",
    "psycopg2-binary",
]

[tool.setuptools]
packages = ["moe_screentime"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
